<!doctype html>
<html lang="ru" style="background: #0a0a0a;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/timoshin_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <title>404 — Страница не найдена | Денис Тимошин</title>
    <meta name="description" content="Такой страницы нет. Вернитесь на главную — там курсы по QA, управлению и ИИ от тимлида Kokoc.tech" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="404 — Страница не найдена | Денис Тимошин" />
    <meta property="og:description" content="Такой страницы нет. Вернитесь на главную — там курсы по QA, управлению и ИИ от тимлида Kokoc.tech" />
    <meta property="og:image" content="https://denis-timoshin.ru/timoshin_it_key.png" />
    <meta property="og:locale" content="ru_RU" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      ::selection { background: #ef5d2b; color: #fff; }

      a { text-decoration: none; }

      /* Шапка */
      .nav {
        position: relative;
        z-index: 10;
        height: 64px;
        display: flex;
        align-items: center;
      }
      .nav-inner {
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        transition: transform 0.3s;
      }
      .brand:hover img { transform: scale(1.1); }
      .brand-name {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .brand-name span { color: #ef5d2b; }

      /* Основной блок */
      .main {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .grid-dots {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
        background-size: 40px 40px;
        pointer-events: none;
      }
      .orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(40px);
        pointer-events: none;
        animation: floatOrb 10s ease-in-out infinite;
        will-change: transform;
        transform: translateZ(0);
      }
      .orb-1 {
        width: 500px; height: 500px;
        top: -60px; right: -80px;
        background: rgba(249, 115, 22, 0.1);
      }
      .orb-2 {
        width: 350px; height: 350px;
        bottom: -60px; left: -80px;
        background: rgba(168, 85, 247, 0.08);
        animation-delay: 2s;
      }
      .orb-3 {
        width: 250px; height: 250px;
        top: 50%; left: 33%;
        background: rgba(59, 130, 246, 0.05);
        animation-delay: 4s;
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        33% { transform: translate3d(15px, -20px, 0) scale(1.05); }
        66% { transform: translate3d(-10px, -30px, 0) scale(1.1); }
      }

      .content {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        padding: clamp(16px, 3.5vh, 32px) 16px clamp(20px, 4.5vh, 48px);
        text-align: center;
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(249, 115, 22, 0.1);
        border: 1px solid rgba(249, 115, 22, 0.2);
        border-radius: 9999px;
        padding: 7px 14px;
        margin-bottom: clamp(10px, 2vh, 18px);
      }
      .badge span {
        font-size: 0.875rem;
        font-weight: 500;
        color: #fb923c;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #ef5d2b;
        animation: pulseDot 2s ease-in-out infinite;
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.5; }
      }

      .code {
        font-size: clamp(4rem, min(28vw, 20vh), 11rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.05em;
        margin: 0 0 clamp(8px, 1.5vh, 12px);
        background: linear-gradient(180deg, #fff 0%, #ef5d2b 120%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        font-size: clamp(1.5rem, min(6vw, 7vh), 3rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin: 0 0 clamp(10px, 2vh, 16px);
        color: #fff;
      }
      h1 em {
        font-style: normal;
        color: #ef5d2b;
      }

      .lead {
        font-size: 1rem;
        line-height: 1.7;
        color: #9ca3af;
        margin: 0 auto clamp(18px, 3.5vh, 30px);
        max-width: 38rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 24px;
        border-radius: 9999px;
        overflow: hidden;
        transition: transform 0.2s ease, background-color 0.3s, border-color 0.3s;
      }
      .btn:hover { transform: scale(1.02); }
      .btn:active { transform: scale(0.98); }
      .btn > * { position: relative; z-index: 10; }
      .btn-primary {
        background: #ef5d2b;
        color: #fff;
      }
      /* Как в хиро: поверх оранжевого проявляется градиент orange-600 -> red-600 */
      .btn-primary::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, #ea580c, #dc2626);
        opacity: 0;
        transition: opacity 0.15s ease-in-out;
      }
      .btn-primary:hover::before { opacity: 1; }
      .btn-primary .arrow {
        animation: arrowBounce 1.5s ease-in-out infinite;
      }
      @keyframes arrowBounce {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(4px); }
      }
      .btn-ghost {
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #d1d5db;
      }
      .btn-ghost:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
      }


      /* Подвал */
      .footer {
        position: relative;
        padding: clamp(18px, 3vh, 32px) 0;
      }
      .footer::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      }
      .footer-inner {
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .footer-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .footer-brand img { width: 32px; height: 32px; object-fit: contain; }
      .footer p, .footer span {
        font-size: 0.875rem;
        color: #4b5563;
        margin: 0;
      }

      @media (min-width: 640px) {
        .nav { height: 80px; }
        .nav-inner, .footer-inner, .content { padding-left: 24px; padding-right: 24px; }
        .lead { font-size: 1.125rem; }
        .btn { padding: 16px 32px; }
        .footer-inner { flex-direction: row; }
      }

      /* Тесные экраны: поджимаем типографику и кнопки, чтобы обойтись без прокрутки */
      @media (max-width: 640px), (max-height: 700px) {
        .lead { font-size: 0.9375rem; line-height: 1.6; }
        .btn { padding: 11px 22px; font-size: 0.9375rem; }
        .actions { gap: 12px; }
        .footer { padding: 16px 0; }
      }

      /* Совсем низкие экраны: бейдж дублирует крупную цифру — убираем его ради места */
      @media (max-height: 640px) {
        .badge { display: none; }
      }

      @media (max-height: 600px) {
        .lead { font-size: 0.875rem; line-height: 1.5; }
        .code { font-size: clamp(3rem, min(24vw, 18vh), 6rem); }
      }

      /* Невысокие телефоны вроде iPhone SE 2/3 и 8 */
      @media (max-width: 400px) and (max-height: 680px) {
        .badge { display: none; }
      }

      @media (max-width: 400px) and (max-height: 600px) {
        .content { padding-top: 12px; padding-bottom: 16px; }
      }

      @media (hover: none) {
        .btn-primary:hover::before { opacity: 0; }
        .btn:hover { transform: none; }
      }

      @media (max-width: 768px) {
        .orb { display: none !important; }
        .dot { animation: none !important; }
        .arrow { animation: none !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="/">
          <img src="/timoshin_logo.png" alt="Денис Тимошин" />
          <span class="brand-name">Денис <span>Тимошин</span></span>
        </a>
      </div>
    </header>

    <main class="main">
      <div class="grid-dots"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <div class="content">
        <div class="badge">
          <span class="dot"></span>
          <span>Ошибка 404</span>
        </div>

        <p class="code">404</p>

        <h1>Этот ключ <em>не подошёл</em></h1>

        <p class="lead">
          Страница переехала или никогда не существовала. На главной есть всё: курсы
          по QA, управлению командой и работе с нейросетями.
        </p>

        <div class="actions">
          <a class="btn btn-primary" href="/">
            <span>На главную</span>
            <svg class="arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M4 9H14M14 9L10 5M14 9L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="btn btn-ghost" href="/#contact">Написать мне</a>
        </div>

      </div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="/timoshin_logo.png" alt="Денис Тимошин" />
          <span>© 2026 Денис Тимошин</span>
        </div>
        <p>Курсы IT без воды</p>
      </div>
    </footer>
  </body>
</html>
